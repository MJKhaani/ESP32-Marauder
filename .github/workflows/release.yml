name: Release on Tag

on:
  push:
    tags:
      - '*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binary (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            arch: universal
            artifact_name: marauder-studio-macos-universal
          - os: windows-latest
            platform: windows/amd64
            arch: amd64
            artifact_name: marauder-studio-windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            artifact_name: marauder-studio-linux-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Desktop Application (Wails)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            if pkg-config --exists webkit2gtk-4.0; then
              wails build -platform ${{ matrix.platform }} -clean
            else
              wails build -platform ${{ matrix.platform }} -tags webkit2_41 -clean
            fi
          else
            wails build -platform ${{ matrix.platform }} -clean
          fi

      - name: Build CLI Binary
        shell: bash
        run: |
          mkdir -p build/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -ldflags="-s -w" -o build/bin/marauder-cli-${{ matrix.arch }}.exe ./cmd/marauder-studio/main.go
          else
            go build -ldflags="-s -w" -o build/bin/marauder-cli-${{ matrix.arch }} ./cmd/marauder-studio/main.go
          fi

      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p release-pkg
          cd build/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../release-pkg/${{ matrix.artifact_name }}.zip *
          elif [ "${{ runner.os }}" = "macOS" ]; then
            zip -r ../../release-pkg/${{ matrix.artifact_name }}.zip *
          else
            tar -czvf ../../release-pkg/${{ matrix.artifact_name }}.tar.gz *
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-pkg/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts and Compute SHA256 Checksums
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
